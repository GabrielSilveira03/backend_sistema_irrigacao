services:
  db-postgres:
    image: postgres:17
    container_name: db_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    networks:
      - private_network
    volumes:
      - postgres_data:/var/lib/postgresql/data

networks:
  private_network:
    driver: bridge

volumes:
  postgres_data: